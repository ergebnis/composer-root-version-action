# https://docs.github.com/en/actions

name: "Release"

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "**"

permissions: {}

jobs:
  release:
    name: "Release"

    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"

    steps:
      - name: "Create release"
        env:
          GH_TOKEN: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
          RELEASE_TAG: "${{ github.ref_name }}"
        run: "gh release create \"${RELEASE_TAG}\" --title \"${RELEASE_TAG}\" --notes \"\""
